global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: bmp-collector
    static_configs:
      - targets: ["host.docker.internal:18080"]
        # On Linux without host.docker.internal, use the host IP or
        # network_mode: host and targets: ["127.0.0.1:18080"]
